<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="完全离线的音乐曲库筛选工具，支持搜索、音质筛选、重复版本检查和本地决策导出。">
<link rel="icon" href="data:,">
<title>Music Library Triage</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--ink:#18212b;--muted:#66717f;--line:#d8dee6;
  --accent:#0b6b53;--accent-soft:#e5f3ee;--warm:#9a4f0b;--warm-soft:#fff0df;
  --danger:#9b2c2c;--danger-soft:#fdeaea;--blue:#255a86;--blue-soft:#eaf2f9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Microsoft YaHei","Noto Sans CJK SC",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.head{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px 10px}
.head-row{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:19px;letter-spacing:0}
.sub{color:var(--muted);margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{border:1px solid var(--line);background:#f8fafa;border-radius:4px;padding:4px 8px;white-space:nowrap}
.badge b{color:var(--accent)}
.tools{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
input[type=search],select{height:34px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 9px;color:var(--ink)}
input[type=search]{min-width:230px;flex:1 1 260px}
select{min-width:120px}
.btn{height:34px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 10px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#aeb9c6;background:#f8fafb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{background:var(--warm-soft);border-color:#e8c79f;color:var(--warm)}
.btn.danger{background:var(--danger-soft);border-color:#e5b7b7;color:var(--danger)}
.hidden{display:none!important}
.main{min-height:0;overflow:auto;padding:0 18px 30px}
.meta{max-width:1600px;margin:12px auto 8px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.meta-right{display:flex;gap:14px;align-items:center}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:auto;max-width:1600px;margin:0 auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1120px}
thead th{position:sticky;top:0;background:#eef2f5;border-bottom:1px solid var(--line);text-align:left;padding:9px 8px;font-size:12px;color:#4a5866;z-index:2}
tbody td{padding:8px;border-bottom:1px solid #edf0f3;vertical-align:top}
tbody tr:nth-child(even){background:#fbfcfd}
tbody tr:hover{background:#f2f7f6}
.title{font-weight:600;min-width:210px}
.tiny{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;border-radius:3px;padding:2px 5px;font-size:12px;white-space:nowrap}
.lossless{background:var(--accent-soft);color:var(--accent)}
.lossy{background:var(--warm-soft);color:var(--warm)}
.limited{background:var(--danger-soft);color:var(--danger)}
.ok{background:var(--blue-soft);color:var(--blue)}
.dup{background:#f2ecfa;color:#65358b}
.actions{display:flex;gap:4px;white-space:nowrap}
.mark{width:54px;height:28px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0;color:var(--ink)}
.mark[data-dec=keep].active{background:var(--accent);border-color:var(--accent);color:#fff}
.mark[data-dec=later].active{background:var(--warm);border-color:var(--warm);color:#fff}
.mark[data-dec=drop].active{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{padding:52px 20px;text-align:center;color:var(--muted);max-width:760px;margin:0 auto}
.empty h2{margin:0 0 8px;font-size:20px;color:var(--ink)}
.empty p{margin:6px 0}
.empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.footer-note{max-width:1600px;margin:10px auto 0;color:var(--muted);font-size:12px}
.toast{position:fixed;right:20px;bottom:20px;background:#15231e;color:#fff;border-radius:6px;padding:10px 14px;box-shadow:0 8px 24px #0004;opacity:0;transform:translateY(8px);transition:.18s;z-index:20;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:#10182066;display:grid;place-items:center;padding:20px;z-index:30}
.dialog{background:#fff;border-radius:8px;width:min(620px,100%);padding:20px;box-shadow:0 20px 60px #0005}
.dialog h2{margin:0 0 8px;font-size:19px}
.dialog p{color:var(--muted);margin:6px 0 14px}
.drop{border:1px dashed #9fadb9;border-radius:6px;padding:22px;text-align:center;background:#fafcfd}
.drop.dragover{border-color:var(--accent);background:var(--accent-soft)}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:800px){
  .head,.tools,.main{padding-left:10px;padding-right:10px}
  .stats{justify-content:flex-start}
  input[type=search]{min-width:100%}
  .meta{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="head-row">
      <div>
        <h1>Music Library Triage</h1>
        <div class="sub" id="subtitle">导入歌单或本地曲库，开始在浏览器里离线筛选。</div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <section class="tools hidden" id="tools">
    <input id="search" type="search" placeholder="搜索歌曲、歌手、专辑、歌曲 ID">
    <select id="quality">
      <option value="">全部音质</option>
      <option value="lossless">有无损</option>
      <option value="lossy">仅有损</option>
      <option value="flac">有 FLAC</option>
      <option value="hires">有 Hi-Res</option>
    </select>
    <select id="permission">
      <option value="">全部权限</option>
      <option value="可获取">可获取</option>
      <option value="有限制">有限制</option>
    </select>
    <select id="decade"><option value="">全部年代</option></select>
    <select id="language"><option value="">全部语言</option></select>
    <select id="genre"><option value="">全部曲风</option></select>
    <select id="duplicate">
      <option value="">全部版本</option>
      <option value="duplicate">仅版本候选</option>
      <option value="recommended">推荐保留版本</option>
      <option value="exact">仅完全重复</option>
    </select>
    <select id="decision">
      <option value="">全部标记</option>
      <option value="keep">保留</option>
      <option value="later">待定</option>
      <option value="drop">删除</option>
      <option value="unmarked">未标记</option>
    </select>
    <button class="btn" id="markKeep">批量保留</button>
    <button class="btn warn" id="markLater">批量待定</button>
    <button class="btn danger" id="markDrop">批量删除</button>
    <button class="btn" id="undo">撤销</button>
    <button class="btn" id="clear">清空标记</button>
    <button class="btn primary" id="exportCsv">导出决策 CSV</button>
    <button class="btn" id="exportJson">导出决策 JSON</button>
    <button class="btn" id="changeData">更换数据</button>
  </section>

  <main class="main">
    <div class="empty" id="emptyState">
      <h2>导入你的曲库</h2>
      <p>支持 JSON 和 CSV。数据只在当前浏览器里处理，不会上传。</p>
      <div class="empty-actions">
        <button class="btn primary" id="openImport">选择文件</button>
        <button class="btn" id="loadSample">加载示例</button>
      </div>
    </div>

    <div class="hidden" id="libraryView">
      <div class="meta">
        <div id="count"></div>
        <div class="meta-right">
          <div id="progress"></div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>序号</th>
              <th>歌曲 / 版本</th>
              <th>歌手</th>
              <th>专辑</th>
              <th>年份</th>
              <th>时长</th>
              <th>音质</th>
              <th>权限</th>
              <th>版本关系</th>
              <th>决策</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="noResults" hidden>没有符合当前条件的歌曲。</div>
      </div>
      <div class="footer-note">决策只保存在本机浏览器中。删除标记不会改动原始数据或音乐文件。</div>
    </div>
  </main>
</div>

<div class="modal hidden" id="importModal">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <h2 id="importTitle">导入曲库</h2>
    <p>支持本工具 JSON，也支持带英文或中文表头的 CSV。</p>
    <div class="drop" id="dropZone">
      <div>把文件拖到这里，或</div>
      <button class="btn primary" id="pickFile">选择 JSON / CSV</button>
      <input class="hidden" id="fileInput" type="file" accept=".json,.csv,application/json,text/csv">
    </div>
    <div class="dialog-actions">
      <button class="btn" id="closeImport">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const PAGE_SIZE = 120;
  const DATA_KEY = "music-library-triage-data-v1";
  const DECISION_KEY = "music-library-triage-decisions-v1";
  const DATA_VERSION = 1;
  const SAMPLE_FALLBACK = {
    summary: { playlistName: "示例曲库", total: 3 },
    rows: [
      {
        index: 1,
        title: "Party Girl",
        singer: "R3HAB",
        album: "Party Girl",
        year: 2020,
        duration: "02:27",
        mid: "00336iYC1ukevA",
        quality: "FLAC 无损",
        lossless: "有无损",
        hires: "否",
        flac: "是",
        permission: "有限制",
      },
      {
        index: 2,
        title: "Calling",
        singer: "Part Six",
        album: "Showtime",
        year: 2009,
        duration: "03:38",
        mid: "000RTMwL1zcwqR",
        quality: "320k 有损",
        lossless: "仅有损",
        hires: "否",
        flac: "否",
        permission: "有限制",
      },
      {
        index: 3,
        title: "Angel (Live)",
        singer: "GTR7",
        album: "Angel Live",
        year: 2024,
        duration: "03:08",
        mid: "000samplelive",
        quality: "320k 有损",
        lossless: "仅有损",
        hires: "否",
        flac: "否",
        permission: "可获取",
        group: "V068",
        duplicate: "可能存在重复版本",
        recommended: "否",
        reason: "同基础标题；音质较弱",
      },
    ],
  };

  let allRows = [];
  let filtered = [];
  let decisions = {};
  let page = 1;
  let undoStack = [];
  let toastTimer;

  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));

  function toast(message) {
    const node = $("toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove("show"), 1900);
  }

  function cleanText(value) {
    return String(value ?? "").replace(/\s+/g, " ").trim();
  }

  function numberOrNull(value) {
    if (value === "" || value == null) return null;
    const number = Number(String(value).replace(/[^\d.-]/g, ""));
    return Number.isFinite(number) ? number : null;
  }

  function pick(row, keys, fallback = "") {
    for (const key of keys) {
      if (row[key] !== undefined && row[key] !== null && row[key] !== "") return row[key];
    }
    return fallback;
  }

  function normalizeRow(row, index) {
    const title = cleanText(pick(row, ["title", "歌曲名", "name", "track", "曲名"]));
    const year = numberOrNull(pick(row, ["year", "发行年份", "date", "发行日期"], ""));
    const quality = cleanText(pick(row, ["quality", "最高音质", "音质"], ""));
    const losslessRaw = cleanText(pick(row, ["lossless", "无损状态"], ""));
    const flacRaw = cleanText(pick(row, ["flac", "是否有FLAC", "有FLAC"], ""));
    const hiresRaw = cleanText(pick(row, ["hires", "是否有HiRes", "有HiRes"], ""));
    const inferLossless = /无损|flac|hires|hi-res|ape|dts/i.test(quality + " " + losslessRaw);
    const permission = cleanText(pick(row, ["permission", "权限"], "")) ||
      (/有限制|付费/.test(cleanText(pick(row, ["payment", "付费状态"], ""))) ? "有限制" : "可获取");

    return {
      index: numberOrNull(pick(row, ["index", "序号", "id"], index + 1)) ?? index + 1,
      title: title || `未命名歌曲 ${index + 1}`,
      subtitle: cleanText(pick(row, ["subtitle", "副标题"], "")),
      version: cleanText(pick(row, ["version", "版本类型"], "")),
      singer: cleanText(pick(row, ["singer", "歌手", "artist", "artists"], "未填写")),
      album: cleanText(pick(row, ["album", "专辑"], "")),
      date: cleanText(pick(row, ["date", "发行日期"], "")),
      year,
      decade: cleanText(pick(row, ["decade", "年代"], "")) || (year ? `${Math.floor(year / 10) * 10}s` : "未知年代"),
      duration: cleanText(pick(row, ["duration", "时长"], "")),
      mid: cleanText(pick(row, ["mid", "歌曲MID", "歌曲ID", "id"], "")),
      language: cleanText(pick(row, ["language", "语言"], "未指定")),
      genre: cleanText(pick(row, ["genre", "曲风"], "未指定")),
      quality: quality || (inferLossless ? "无损" : "仅有损"),
      lossless: losslessRaw || (inferLossless ? "有无损" : "仅有损"),
      hires: hiresRaw || (/hi-res|hires/i.test(quality) ? "是" : "否"),
      flac: flacRaw || (/flac/i.test(quality) ? "是" : "否"),
      lossy: inferLossless ? "否" : "是",
      payment: cleanText(pick(row, ["payment", "付费状态"], "")),
      permission: permission === "有限制" || permission === "可获取" ? permission : "可获取",
      group: cleanText(pick(row, ["group", "重复组"], "")),
      duplicate: cleanText(pick(row, ["duplicate", "重复判断", "重复"], "")),
      recommended: cleanText(pick(row, ["recommended", "推荐保留"], "")),
      reason: cleanText(pick(row, ["reason", "建议理由"], "")),
      url: cleanText(pick(row, ["url", "原链接", "link"], "")),
    };
  }

  function normalizePayload(payload) {
    const sourceRows = Array.isArray(payload) ? payload : payload.rows;
    if (!Array.isArray(sourceRows)) throw new Error("没有找到 rows 数组。");
    return {
      summary: Array.isArray(payload) ? {} : (payload.summary || {}),
      rows: sourceRows.map(normalizeRow),
      importedAt: new Date().toISOString(),
    };
  }

  function parseCsv(text) {
    const source = text.replace(/^\uFEFF/, "");
    const rows = [];
    let row = [];
    let field = "";
    let quoted = false;

    for (let index = 0; index < source.length; index += 1) {
      const char = source[index];
      const next = source[index + 1];
      if (quoted) {
        if (char === '"' && next === '"') {
          field += '"';
          index += 1;
        } else if (char === '"') {
          quoted = false;
        } else {
          field += char;
        }
      } else if (char === '"') {
        quoted = true;
      } else if (char === ",") {
        row.push(field);
        field = "";
      } else if (char === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else if (char !== "\r") {
        field += char;
      }
    }
    row.push(field);
    rows.push(row);

    const headers = rows.shift().map((value) => cleanText(value));
    return rows
      .filter((values) => values.some((value) => cleanText(value)))
      .map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] ?? ""])));
  }

  function setOptions(select, values) {
    select.querySelectorAll("option:not(:first-child)").forEach((option) => option.remove());
    for (const value of values.filter(Boolean).sort((a, b) => a.localeCompare(b, "zh-CN"))) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    }
  }

  function decisionOf(row) {
    return decisions[String(row.index)] || "";
  }

  function saveDecisions() {
    localStorage.setItem(DECISION_KEY, JSON.stringify(decisions));
  }

  function loadDataset(dataset) {
    allRows = dataset.rows;
    decisions = JSON.parse(localStorage.getItem(DECISION_KEY) || "{}");
    page = 1;
    undoStack = [];
    localStorage.setItem(DATA_KEY, JSON.stringify({
      version: DATA_VERSION,
      dataset,
    }));

    $("emptyState").classList.add("hidden");
    $("libraryView").classList.remove("hidden");
    $("tools").classList.remove("hidden");
    $("subtitle").textContent = `${dataset.summary?.playlistName || dataset.summary?.name || "已导入曲库"} · ${allRows.length} 首 · 数据仅保存在本机浏览器`;

    setOptions($("decade"), [...new Set(allRows.map((row) => row.decade))]);
    setOptions($("language"), [...new Set(allRows.map((row) => row.language))]);
    setOptions($("genre"), [...new Set(allRows.map((row) => row.genre))]);
    applyFilters();
    toast(`已导入 ${allRows.length} 首`);
  }

  function applyFilters() {
    const query = $("search").value.trim().toLowerCase();
    const quality = $("quality").value;
    const permission = $("permission").value;
    const decade = $("decade").value;
    const language = $("language").value;
    const genre = $("genre").value;
    const duplicate = $("duplicate").value;
    const decision = $("decision").value;

    filtered = allRows.filter((row) => {
      if (query) {
        const haystack = [row.title,row.subtitle,row.singer,row.album,row.mid].join(" ").toLowerCase();
        if (!haystack.includes(query)) return false;
      }
      if (quality === "lossless" && row.lossless !== "有无损") return false;
      if (quality === "lossy" && row.lossless !== "仅有损") return false;
      if (quality === "flac" && row.flac !== "是") return false;
      if (quality === "hires" && row.hires !== "是") return false;
      if (permission && row.permission !== permission) return false;
      if (decade && row.decade !== decade) return false;
      if (language && row.language !== language) return false;
      if (genre && row.genre !== genre) return false;
      if (duplicate === "duplicate" && !row.duplicate) return false;
      if (duplicate === "recommended" && row.recommended !== "是") return false;
      if (duplicate === "exact" && !/完全重复/.test(row.duplicate)) return false;
      const marked = decisionOf(row);
      if (decision === "unmarked" && marked) return false;
      if (decision && decision !== "unmarked" && marked !== decision) return false;
      return true;
    });

    page = 1;
    render();
  }

  function badge(text, className) {
    return `<span class="tag ${className}">${esc(text)}</span>`;
  }

  function rowHtml(row) {
    const relation = row.duplicate
      ? `<span class="tag dup">${esc((row.group ? row.group + " " : "") + row.duplicate)}</span>` +
        (row.reason ? `<div class="tiny">${esc(row.reason)}</div>` : "")
      : '<span class="tiny">—</span>';
    const version = [row.version, row.subtitle].filter(Boolean).join(" · ");
    return `<tr>
      <td>${esc(row.index)}</td>
      <td class="title">${esc(row.title)}
        ${version ? `<div class="tiny">${esc(version)}</div>` : ""}
        ${row.mid ? `<div class="tiny">ID ${esc(row.mid)}</div>` : ""}
      </td>
      <td>${esc(row.singer)}</td>
      <td>${esc(row.album)}</td>
      <td>${esc(row.year || "未知")}</td>
      <td>${esc(row.duration)}</td>
      <td>${badge(row.quality || row.lossless, row.lossless === "有无损" ? "lossless" : "lossy")}</td>
      <td>${badge(row.permission, row.permission === "可获取" ? "ok" : "limited")}</td>
      <td>${relation}</td>
      <td><div class="actions">
        <button class="mark" data-index="${esc(row.index)}" data-dec="keep">保留</button>
        <button class="mark" data-index="${esc(row.index)}" data-dec="later">待定</button>
        <button class="mark" data-index="${esc(row.index)}" data-dec="drop">删除</button>
      </div></td>
    </tr>`;
  }

  function render() {
    const visible = filtered.slice(0, page * PAGE_SIZE);
    $("tbody").innerHTML = visible.map(rowHtml).join("");
    $("noResults").hidden = filtered.length !== 0;
    $("count").textContent = `当前显示 ${visible.length} / ${filtered.length} 首，全部 ${allRows.length} 首`;

    const counts = { keep:0, later:0, drop:0 };
    for (const row of allRows) {
      const marked = decisionOf(row);
      if (counts[marked] != null) counts[marked] += 1;
    }
    const unmarked = allRows.length - counts.keep - counts.later - counts.drop;
    $("progress").textContent = `保留 ${counts.keep} · 待定 ${counts.later} · 删除 ${counts.drop} · 未标记 ${unmarked}`;

    const lossless = allRows.filter((row) => row.lossless === "有无损").length;
    const lossy = allRows.filter((row) => row.lossless === "仅有损").length;
    const duplicates = allRows.filter((row) => row.duplicate).length;
    $("stats").innerHTML = [
      ["总数", allRows.length],
      ["有无损", lossless],
      ["仅有损", lossy],
      ["版本候选", duplicates],
    ].map(([label, value]) => `<span class="badge">${label} <b>${value}</b></span>`).join("");

    document.querySelectorAll(".mark").forEach((button) => {
      button.classList.toggle(
        "active",
        decisionOf({ index: Number(button.dataset.index) }) === button.dataset.dec,
      );
    });
  }

  function setDecision(indexes, value) {
    const changes = [];
    for (const index of indexes) {
      const key = String(index);
      const before = decisions[key] || "";
      if (before === value) continue;
      changes.push({ key, before });
      if (value) decisions[key] = value;
      else delete decisions[key];
    }
    if (!changes.length) return;
    undoStack.push(changes);
    if (undoStack.length > 50) undoStack.shift();
    saveDecisions();
    render();
  }

  $("tbody").addEventListener("click", (event) => {
    const button = event.target.closest(".mark");
    if (!button) return;
    const index = Number(button.dataset.index);
    const next = decisionOf({ index }) === button.dataset.dec ? "" : button.dataset.dec;
    setDecision([index], next);
  });

  for (const id of ["search","quality","permission","decade","language","genre","duplicate","decision"]) {
    $(id).addEventListener("input", applyFilters);
    $(id).addEventListener("change", applyFilters);
  }

  $("markKeep").addEventListener("click", () => {
    setDecision(filtered.map((row) => row.index), "keep");
    toast("当前筛选结果已标为保留");
  });
  $("markLater").addEventListener("click", () => {
    setDecision(filtered.map((row) => row.index), "later");
    toast("当前筛选结果已标为待定");
  });
  $("markDrop").addEventListener("click", () => {
    setDecision(filtered.map((row) => row.index), "drop");
    toast("当前筛选结果已标为删除");
  });
  $("undo").addEventListener("click", () => {
    const changes = undoStack.pop();
    if (!changes) return toast("没有可撤销的操作");
    for (const change of changes) {
      if (change.before) decisions[change.key] = change.before;
      else delete decisions[change.key];
    }
    saveDecisions();
    render();
    toast("已撤销最近一次标记");
  });
  $("clear").addEventListener("click", () => {
    if (!confirm("清空全部保留、待定和删除标记？")) return;
    const changes = Object.entries(decisions).map(([key, before]) => ({ key, before }));
    decisions = {};
    if (changes.length) undoStack.push(changes);
    saveDecisions();
    render();
    toast("已清空全部标记");
  });

  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    URL.revokeObjectURL(url);
  }

  function exportRows() {
    return allRows.map((row) => ({
      ...row,
      decision: decisionOf(row),
      decisionLabel: { keep:"保留",later:"待定",drop:"删除" }[decisionOf(row)] || "未标记",
    }));
  }

  $("exportCsv").addEventListener("click", () => {
    const headers = ["index","title","version","singer","album","year","quality","lossless","permission","group","duplicate","recommended","decision"];
    const quote = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
    const lines = [headers.map(quote).join(",")];
    for (const row of exportRows()) {
      lines.push([
        row.index,row.title,row.version,row.singer,row.album,row.year,row.quality,
        row.lossless,row.permission,row.group,row.duplicate,row.recommended,row.decisionLabel,
      ].map(quote).join(","));
    }
    download("music-library-decisions.csv", "\uFEFF" + lines.join("\r\n"), "text/csv;charset=utf-8");
    toast("已导出决策 CSV");
  });

  $("exportJson").addEventListener("click", () => {
    download(
      "music-library-decisions.json",
      JSON.stringify({ exportedAt: new Date().toISOString(), rows: exportRows() }, null, 2),
      "application/json;charset=utf-8",
    );
    toast("已导出决策 JSON");
  });

  async function importFile(file) {
    try {
      const text = await file.text();
      const payload = file.name.toLowerCase().endsWith(".csv")
        ? parseCsv(text)
        : JSON.parse(text);
      const dataset = normalizePayload(payload);
      if (!dataset.rows.length) throw new Error("文件中没有可用歌曲。");
      loadDataset(dataset);
      $("importModal").classList.add("hidden");
    } catch (error) {
      toast(`导入失败：${error.message}`);
    }
  }

  $("openImport").addEventListener("click", () => $("importModal").classList.remove("hidden"));
  $("changeData").addEventListener("click", () => $("importModal").classList.remove("hidden"));
  $("closeImport").addEventListener("click", () => $("importModal").classList.add("hidden"));
  $("pickFile").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", (event) => {
    const file = event.target.files?.[0];
    if (file) importFile(file);
    event.target.value = "";
  });

  const dropZone = $("dropZone");
  for (const eventName of ["dragenter","dragover"]) {
    dropZone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropZone.classList.add("dragover");
    });
  }
  for (const eventName of ["dragleave","drop"]) {
    dropZone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropZone.classList.remove("dragover");
    });
  }
  dropZone.addEventListener("drop", (event) => {
    const file = event.dataTransfer?.files?.[0];
    if (file) importFile(file);
  });

  $("loadSample").addEventListener("click", async () => {
    loadDataset(normalizePayload(SAMPLE_FALLBACK));
  });

  const scroller = document.querySelector(".main");
  scroller.addEventListener("scroll", () => {
    if (!allRows.length || page * PAGE_SIZE >= filtered.length) return;
    if (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 500) {
      page += 1;
      render();
    }
  }, { passive: true });

  try {
    const cached = JSON.parse(localStorage.getItem(DATA_KEY) || "null");
    if (cached?.version === DATA_VERSION && cached.dataset?.rows?.length) {
      loadDataset(cached.dataset);
      toast("已恢复上次导入的数据");
    }
  } catch {
    localStorage.removeItem(DATA_KEY);
  }
})();
</script>
</body>
</html>
